name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "deadline-dashboard.js"
      - "data/gradescope.json"
      - "data/bcourses.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css deadline-dashboard.js _site/
          cp data/gradescope.json data/bcourses.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
