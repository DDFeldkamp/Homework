name: Sync Gradescope

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape student Gradescope courses
        env:
          GRADESCOPE_EMAIL: ${{ secrets.GRADESCOPE_EMAIL }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
        run: python scripts/sync_gradescope.py --output /tmp/gradescope.json

      - name: Upload deadlines to private API
        env:
          DEADLINE_API_URL: ${{ secrets.DEADLINE_API_URL }}
          DEADLINE_SYNC_TOKEN: ${{ secrets.DEADLINE_SYNC_TOKEN }}
        run: |
          test -n "$DEADLINE_API_URL" || (echo "Missing DEADLINE_API_URL" && exit 1)
          test -n "$DEADLINE_SYNC_TOKEN" || (echo "Missing DEADLINE_SYNC_TOKEN" && exit 1)
          curl --fail-with-body --silent --show-error \
            -X POST "${DEADLINE_API_URL%/}/sync" \
            -H "Authorization: Bearer $DEADLINE_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/gradescope.json
