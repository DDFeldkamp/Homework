name: Sync deadlines

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Fall 2026 student Gradescope courses
        env:
          GRADESCOPE_EMAIL: ${{ secrets.GRADESCOPE_EMAIL }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
        run: python scripts/sync_gradescope.py --output data/gradescope.json

      - name: Sync Fall 2026 student bCourses courses
        env:
          BCOURSES_TOKEN: ${{ secrets.BCOURSES_TOKEN }}
        run: python scripts/sync_bcourses.py --output data/bcourses.json

      - name: Sync Fall 2026 Pensive courses
        env:
          PENSIVE_TOKEN: ${{ secrets.PENSIVE_TOKEN }}
        run: python scripts/sync_pensive.py --output data/pensive.json

      - name: Sync EECS 151 public course calendar
        run: python scripts/sync_eecs151.py --output data/eecs151.json

      - name: Commit public deadline metadata
        run: |
          if git diff --quiet -- data/gradescope.json data/bcourses.json data/pensive.json data/eecs151.json; then
            echo "No metadata changes."
          else
            git config user.name "deadline-sync[bot]"
            git config user.email "deadline-sync[bot]@users.noreply.github.com"
            git add data/gradescope.json data/bcourses.json data/pensive.json data/eecs151.json
            git commit -m "chore: sync assignment deadlines"
            git push
          fi

      - name: Build GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css deadline-dashboard.js _site/
          cp data/gradescope.json data/bcourses.json data/pensive.json data/eecs151.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
