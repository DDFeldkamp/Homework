<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Deadline Dashboard</title>
  <script>
    (() => {
      const saved = localStorage.getItem('deadline-theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="banner">
    <div class="banner-inner">
      <div class="brand-block">
        <h1>Deadline Dashboard</h1>
        <span id="currentDate" class="current-date"></span>
      </div>
      <div class="banner-actions">
        <span id="syncStatus" class="sync-status">Starting dashboard…</span>
        <button id="themeBtn" class="icon-button" type="button" aria-label="Toggle light/dark theme">☾</button>
        <button id="addBtn" class="button primary" type="button">+ Add</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="summary" aria-label="Deadline summary">
      <div><span>Due today</span><strong id="countToday">0</strong></div>
      <div><span>Next 7 days</span><strong id="count7">0</strong></div>
      <div><span>Upcoming</span><strong id="countUpcoming">0</strong></div>
      <div><span>Done</span><strong id="countDone">0</strong></div>
    </section>

    <section class="toolbar">
      <div class="tabs" role="tablist" aria-label="Assignment filters">
        <button class="tab active" data-filter="upcoming" type="button">Upcoming</button>
        <button class="tab" data-filter="all" type="button">All</button>
        <button class="tab" data-filter="done" type="button">Done</button>
      </div>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search course or assignment" />
      </label>
    </section>

    <section id="assignmentList" class="assignment-list" aria-live="polite"></section>
  </main>


  <dialog id="assignmentDialog">
    <form id="assignmentForm">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">MANUAL ASSIGNMENT</p>
          <h2>Add assignment</h2>
        </div>
        <button type="button" id="closeDialog" class="icon-button" aria-label="Close">×</button>
      </div>

      <label>Assignment
        <input name="title" required placeholder="Problem Set 4" />
      </label>
      <label>Course
        <input name="course" placeholder="CS 182" />
      </label>

      <div class="grid2">
        <label>Due date
          <input name="due" type="datetime-local" required />
        </label>
        <label>Late deadline
          <input name="late_due" type="datetime-local" />
        </label>
      </div>

      <div class="grid2">
        <label>Repeat
          <select name="recurrence">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Every 2 weeks</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label>Repeat until
          <input name="repeat_until" type="date" />
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="button subtle">Cancel</button>
        <button type="submit" class="button primary">Add assignment</button>
      </div>
    </form>
  </dialog>

  <template id="assignmentTemplate">
    <article class="assignment-row">
      <div class="date-cell">
        <span class="date-month"></span>
        <strong class="date-day"></strong>
        <span class="date-time"></span>
      </div>
      <button class="check" type="button" aria-label="Mark complete"></button>
      <div class="assignment-copy">
        <div class="assignment-heading">
          <div>
            <div class="meta-line">
              <span class="course-pill"></span>
              <span class="source-pill"></span>
            </div>
            <h3 class="title"></h3>
          </div>
          <button class="delete-btn" type="button" aria-label="Delete manual assignment">×</button>
        </div>

        <div class="deadline-line">
          <strong class="remaining"></strong>
          <span class="due-full"></span>
        </div>

        <div class="bar-track" aria-hidden="true"><div class="bar-fill"></div></div>

        <div class="late-line">
          <span class="late"></span>
          <a class="open-link" target="_blank" rel="noreferrer">Open ↗</a>
        </div>
      </div>
    </article>
  </template>

  <script>
    window.addEventListener("error", (event) => {
      const status = document.querySelector("#syncStatus");
      if (status) status.textContent = `Dashboard error · ${event.message || "JavaScript failed to load"}`;
    });
  </script>
  <script
    src="./deadline-dashboard.js?v=20260908-2"
    onerror="document.querySelector('#syncStatus').textContent='Dashboard error · deadline-dashboard.js failed to load'"
  ></script>
</body>
</html>
